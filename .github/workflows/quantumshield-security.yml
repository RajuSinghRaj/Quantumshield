name: QuantumShield 2.0 Cryptographic Security Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cryptographic-audit:
    name: Cryptographic Discovery & CI/CD Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install QuantumShield Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic requests

      - name: Run QuantumShield DevSecOps Security Gate
        id: security_gate
        env:
          QUANTUMSHIELD_API_URL: ${{ secrets.QUANTUMSHIELD_API_URL }}
          QUANTUMSHIELD_API_TOKEN: ${{ secrets.QUANTUMSHIELD_API_TOKEN }}
        run: |
          echo "=========================================================="
          echo "  QuantumShield 2.0 — DevSecOps Cryptographic Security Gate"
          echo "=========================================================="

          # Run local CLI gate evaluation with quantumshield.yml policies
          # Exit Code 0: PASS / PASS_WITH_WARNINGS
          # Exit Code 1: FAIL (Blocking violations or threshold breach)
          # Exit Code 2: MANUAL_REVIEW_REQUIRED
          python backend/quantumshield_cli.py devsecops evaluate . \
            --policy quantumshield.yml \
            --output security-assessment.json

          # Export CycloneDX 1.6 Cryptographic Bill of Materials (CBOM)
          python backend/quantumshield_cli.py cbom export . \
            --output cbom-cyclonedx-1.6.json

      - name: Generate Security Gate Markdown Summary
        if: always()
        run: |
          if [ -f security-assessment.json ]; then
            python -c "
          import json
          with open('security-assessment.json') as f:
              data = json.load(f)
          gate = data.get('gate_result', {})
          status = gate.get('pipeline_status', 'UNKNOWN')
          summary = gate.get('summary', '')
          print(f'### QuantumShield Cryptographic Gate: **{status}**\n')
          print(f'> {summary}\n')
          print('| Metric | Value |')
          print('| :--- | :--- |')
          print(f'| Total Assets | {data.get(\"total_cryptographic_assets\")} |')
          print(f'| Classical Risk | {data.get(\"classical_risk_score\")}/100 |')
          print(f'| Quantum Readiness | {data.get(\"quantum_readiness_score\")}% |')
          print(f'| Blocking Violations | {len(gate.get(\"blocking_violations\", []))} |')
          print(f'| Advisory Warnings | {len(gate.get(\"advisory_warnings\", []))} |')
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload CBOM Artifact (CycloneDX 1.6)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumshield-cbom
          path: cbom-cyclonedx-1.6.json
          retention-days: 90

      - name: Upload Security Assessment Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumshield-security-assessment
          path: security-assessment.json
          retention-days: 90

